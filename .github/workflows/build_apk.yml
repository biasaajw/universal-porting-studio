name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Generate Fresh Flutter Project Structure
        run: |
          flutter create temp_app --platforms=android --org com.porting.studio
          cp -f pubspec.yaml temp_app/
          cp -f lib/main.dart temp_app/lib/
          cd temp_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-release-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
