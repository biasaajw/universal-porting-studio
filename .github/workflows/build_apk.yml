name: Build Signed Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Decode Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Buat direktori android/app/ terlebih dahulu jika belum ada
          mkdir -p android/app
          # Buat file keystore sementara
          echo $KEYSTORE_BASE64 | base64 --decode > android/app/upload-keystore.jks

      - name: Generate Fresh Flutter Project & Inject Signing Config
        run: |
          flutter create temp_app --platforms=android --org com.porting.studio
          cp -f pubspec.yaml temp_app/
          cp -f lib/main.dart temp_app/lib/
          
          # Pindahkan keystore ke proyek temporary
          mkdir -p temp_app/android/app
          mv android/app/upload-keystore.jks temp_app/android/app/
          
          # Tambahkan konfigurasi signing ke build.gradle
          BUILD_GRADLE="temp_app/android/app/build.gradle"
          
          # Menyisipkan blok signingConfigs
          sed -i '/android {/a \
          signingConfigs {\
              release {\
                  storeFile file("upload-keystore.jks")\
                  storePassword "${{ secrets.STORE_PASSWORD }}"\
                  keyAlias "${{ secrets.KEY_ALIAS }}"\
                  keyPassword "${{ secrets.KEY_PASSWORD }}"\
              }\
          }' $BUILD_GRADLE
          
          # Menerapkan signingConfig ke buildTypes release
          sed -i 's/minifyEnabled false/minifyEnabled false\n            signingConfig signingConfigs.release/g' $BUILD_GRADLE

          cd temp_app
          flutter pub get
          flutter build apk --release

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-signed-release-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
